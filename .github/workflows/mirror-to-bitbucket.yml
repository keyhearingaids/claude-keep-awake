name: Mirror to Bitbucket

# No branch/tag filters: a bare "push" trigger fires for every push to every branch and every
# tag in this repo (T-026's "must run on every push" requirement), not just the default branch.
on:
  push:

# The repo's default GITHUB_TOKEN is read-only, so grant exactly what the steps need:
# read to mirror-clone, issues: write for the failure issue (added 2026-11-04; without it the
# failure step itself fails with 403 and no issue is opened).
permissions:
  contents: read
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # A mirror-clone of the GitHub side, not actions/checkout — checkout only fetches the ref
      # that triggered the run, even with fetch-depth: 0. --mirror clones every branch, tag, and
      # ref with full history in one step (T-026's "full history" requirement), independent of
      # which single ref caused this run.
      - name: Mirror-clone from GitHub
        run: git clone --mirror "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-mirror

      - name: Push mirror to Bitbucket
        working-directory: repo-mirror
        env:
          BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
          BITBUCKET_REPO_URL: ${{ secrets.BITBUCKET_REPO_URL }}
        run: |
          AUTH_URL="${BITBUCKET_REPO_URL/https:\/\//https:\/\/${BITBUCKET_USERNAME}:${BITBUCKET_API_TOKEN}@}"
          git push --mirror "$AUTH_URL"

      # Self-contained failure signal: opens (or comments on, if already open) a same-named issue
      # in this repo. Doesn't depend on the pusher's personal GitHub email-notification settings,
      # and needs no secret beyond the default GITHUB_TOKEN (T-026's "failure notification"
      # requirement).
      - name: Open or update a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Bitbucket mirror push failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The Bitbucket mirror workflow failed for commit ${context.sha} on \`${context.ref}\`.\n\nRun: ${runUrl}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bitbucket-mirror',
            });
            const match = existing.data.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bitbucket-mirror'],
              });
            }
